services:
  - type: web
    name: vantix-api
    runtime: node
    plan: starter          # القرص الدائم يتطلب خطة مدفوعة
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: vantix-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /var/data/vantix.db
      - key: TRUST_PROXY
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5
      - key: CORS_ORIGIN
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: TWELVEDATA_KEY
        sync: false
